; Upload limits for this project (read by PHP-FPM / FastCGI / LiteSpeed, e.g. cPanel hosting and Laragon).
; Lets large photos and documents upload without hitting the server's default php.ini limits.
; PHP re-reads this file every few minutes (user_ini.cache_ttl, default 300 s).
upload_max_filesize = 2048M
post_max_size = 2048M
memory_limit = 1024M
max_execution_time = 600
max_input_time = 600
max_file_uploads = 50
